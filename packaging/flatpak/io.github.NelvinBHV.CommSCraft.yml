# CI preview only. No releases, signing, external deployment or repository writes.
app-id: io.github.NelvinBHV.CommSCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # FFmpeg's Rust bindings use bindgen, which loads libclang during compilation.
  - org.freedesktop.Sdk.Extension.llvm20
command: commscraft
finish-args:
  # Login, discovery, SIP, TURN, meetings and other authorized network traffic.
  - --share=network
  # egui/winit: Wayland preferred; fallback X11 and GPU rendering.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Audio through the desktop sound server.
  - --socket=pulseaudio
  # Native V4L2 camera access (the app does not yet use a camera portal).
  # This grants broad device access; revisit after a portal integration.
  - --device=all
  # The Secret Service keyring via D-Bus, if available in the session.
  - --talk-name=org.freedesktop.secrets
modules:
  # Freedesktop 25.08 does not ship GSSAPI. Ship MIT Kerberos with the
  # application so libgssapi-sys can compile and the shared library is present
  # in the installed Flatpak too (similar to Flathub's Betterbird recipe).
  - name: mit-krb5
    buildsystem: autotools
    subdir: src
    config-opts:
      - --disable-static
      - --disable-rpath
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.tar.gz
        sha256: 652be617b4647f3c5dcac21547d47c7097101aad4e306f1778fb48e17b220ba3

  - name: commscraft
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_NET_OFFLINE: 'true'
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        CARGO_HOME: /run/build/commscraft/cargo-home
    build-commands:
      - mkdir -p .cargo
      - cp cargo/config .cargo/config.toml
      - cargo build --offline --locked --release --package commscraft
      - install -Dm755 target/release/commscraft /app/bin/commscraft
      - install -Dm644 packaging/flatpak/io.github.NelvinBHV.CommSCraft.desktop /app/share/applications/io.github.NelvinBHV.CommSCraft.desktop
      - install -Dm644 packaging/flatpak/io.github.NelvinBHV.CommSCraft.metainfo.xml /app/share/metainfo/io.github.NelvinBHV.CommSCraft.metainfo.xml
      - install -Dm644 assets/branding/CommSCraft-icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.NelvinBHV.CommSCraft.png
      - install -Dm644 assets/branding/CommSCraft-icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.NelvinBHV.CommSCraft.png
    sources:
      # Local checkout allows PR builds to test the exact proposed commit.
      - type: dir
        path: ../..
      # This file is generated in the workflow from Cargo.lock before the build.
      - cargo-sources.json
