# Flatpak build of the CommSCraft desktop client. Built by .github/workflows/flatpak.yml on free
# GitHub-hosted runners; the bundle is attached to the GitHub release.
#
# Licensing: CommSCraft (MIT OR Apache-2.0), its Rust dependencies and MIT Kerberos (MIT-style
# licence) are built into the bundle. FFmpeg is not bundled: the freedesktop runtime provides it, and the runtime extension
# org.freedesktop.Platform.ffmpeg-full (installed from Flathub on demand) adds H.264.
app-id: io.github.NelvinBHV.CommSCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: commscraft
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # GPU (VA-API) and camera (V4L2).
  - --device=all
  # Keyring (Secret Service), idle time for the status automation.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  # Meeting recordings (XDG videos folder).
  - --filesystem=xdg-videos/CommSCraft:create
  - --talk-name=org.gnome.Mutter.IdleMonitor
  - --talk-name=org.freedesktop.ScreenSaver
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    no-autodownload: false
    autodelete: false
cleanup-commands:
  - mkdir -p /app/lib/ffmpeg
modules:
  # MIT Kerberos (MIT-style licence, bundled): GSSAPI for the Kerberos sign-in; the freedesktop
  # runtime has none.
  - name: krb5
    buildsystem: autotools
    subdir: src
    config-opts:
      - --disable-static
      - --disable-rpath
    cleanup:
      - /bin
      - /sbin
      - /share/man
      - /share/examples
      - /var
    sources:
      - type: archive
        # Detached signature checked on update: key C4493CB739F4A89F9852CBC20CBA08575F8372DF
        # (Greg Hudson, MIT krb5 release manager). scripts/check_native_components.py reports
        # newer releases (issue #256).
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.3.tar.gz
        sha256: fe90af8441ad9fa9b064b8e53077cefb782a96f8a68276b031dc54af1789ff0b
  - name: commscraft
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/commscraft/cargo-home
        CARGO_NET_OFFLINE: 'true'
        PKG_CONFIG_PATH: /app/lib/pkgconfig
        # The craft-fonts faces are required in a release (build.rs).
        CRAFT_FONTS_DIR: /run/build/commscraft/craft-fonts
        CRAFT_FONTS_REQUIRED: '1'
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
    build-commands:
      # The crates come as checksum-verified offline sources (cargo-sources.json, generated by
      # scripts/generate_flatpak_cargo_sources.py from Cargo.lock in the workflow).
      - mkdir -p .cargo
      - cp cargo/config .cargo/config.toml
      - cargo build --offline --locked --release -p commscraft
      - install -Dm755 target/release/commscraft /app/bin/commscraft
      - install -Dm644 packaging/flatpak/io.github.NelvinBHV.CommSCraft.desktop /app/share/applications/io.github.NelvinBHV.CommSCraft.desktop
      - install -Dm644 packaging/flatpak/io.github.NelvinBHV.CommSCraft.metainfo.xml /app/share/metainfo/io.github.NelvinBHV.CommSCraft.metainfo.xml
      - for s in 16 32 64 128 256 512; do install -Dm644 assets/branding/CommSCraft-icon-$s.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.NelvinBHV.CommSCraft.png; done
      - install -Dm644 LICENSE-MIT /app/share/licenses/io.github.NelvinBHV.CommSCraft/LICENSE-MIT
      - install -Dm644 LICENSE-APACHE /app/share/licenses/io.github.NelvinBHV.CommSCraft/LICENSE-APACHE
      # Spell checking: Hunspell dictionaries as data files (LibreOffice dictionaries; German
      # GPL-2.0-or-3.0, English SCOWL), with their licences (ATTRIBUTION.md).
      - install -Dm644 dict/de_DE_frami.aff /app/share/hunspell/de_DE.aff
      - install -Dm644 dict/de_DE_frami.dic /app/share/hunspell/de_DE.dic
      - install -Dm644 dict/en_US.aff /app/share/hunspell/en_US.aff
      - install -Dm644 dict/en_US.dic /app/share/hunspell/en_US.dic
      - install -Dm644 dict/COPYING_GPLv2 /app/share/licenses/io.github.NelvinBHV.CommSCraft/hunspell-de_DE-COPYING_GPLv2
      - install -Dm644 dict/README_de_DE_frami.txt /app/share/licenses/io.github.NelvinBHV.CommSCraft/hunspell-de_DE-README.txt
      - install -Dm644 dict/README_en_US.txt /app/share/licenses/io.github.NelvinBHV.CommSCraft/hunspell-en_US-README.txt
    sources:
      - type: dir
        path: ../..
      - type: git
        url: https://github.com/storytold/craft-fonts.git
        commit: 26a79230872f9b2acd3dd68500677e294350ab94
        dest: craft-fonts
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/de/de_DE_frami.aff
        sha256: 646bf3333ac69c23e9d794533ee5241d6f755c359e8fe10a648f87613743d594
        dest: dict
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/de/de_DE_frami.dic
        sha256: 4ca3c958b0e5545910999bc246f668840bf8ede3df8e5e6790d05edd5a586c38
        dest: dict
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/de/COPYING_GPLv2
        sha256: e7431ac20e815b6797369e802f9e4bb1b0082485060d8b096235f035d741bd89
        dest: dict
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/de/README_de_DE_frami.txt
        sha256: c141f4f79c428b7348b5012836f4ad3db4d124f288f15effc22696dc876512ae
        dest: dict
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/en/en_US.aff
        sha256: e746c882dd6f303c2c46e7452804b9201115a6942cfeb15f18f8edf774d2e24e
        dest: dict
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/en/en_US.dic
        sha256: f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647
        dest: dict
      - type: file
        url: https://raw.githubusercontent.com/LibreOffice/dictionaries/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/en/README_en_US.txt
        sha256: 168b4c01cb841f766a72f310b065c04d09cff46376c37a81d799593ce751c371
        dest: dict
      - cargo-sources.json
