[package]
name = "commscraft-client"
description = "Shared client runtime of the command-line tool and the desktop client: discovery with the trust model, the endpoint ID, the media thread of a call, ringing and music on hold"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
commscraft-audio-alsa = { path = "../audio-alsa" }
commscraft-avedgea = { path = "../avedgea" }
commscraft-call-media = { path = "../call-media" }
commscraft-discovery = { path = "../discovery" }
commscraft-dlx = { path = "../dlx" }
commscraft-ews = { path = "../ews" }
commscraft-presence = { path = "../presence" }
commscraft-ntlm = { path = "../ntlm" }
commscraft-sipae = { path = "../sipae" }
commscraft-ocauthws = { path = "../ocauthws" }
commscraft-sip-identity = { path = "../sip-identity" }
commscraft-tlsdsk = { path = "../tlsdsk" }
commscraft-media = { path = "../media" }
commscraft-net = { path = "../net" }
commscraft-abs = { path = "../abs" }
commscraft-provisioning = { path = "../provisioning" }
commscraft-register = { path = "../register" }
commscraft-qoe = { path = "../qoe" }
commscraft-sdp = { path = "../sdp" }
commscraft-tones = { path = "../tones" }
commscraft-turn-bwm = { path = "../turn-bwm" }
commscraft-ucwa = { path = "../ucwa" }
commscraft-url = { path = "../url" }
commscraft-conf = { path = "../conf" }
commscraft-h264uc = { path = "../h264uc" }
commscraft-psom = { path = "../psom" }
commscraft-rdp-view = { path = "../rdp-view" }
commscraft-rtp = { path = "../rtp" }
commscraft-session = { path = "../session" }
commscraft-video-ffmpeg = { path = "../video-ffmpeg" }
commscraft-screen-capture = { path = "../screen-capture" }
commscraft-video-wayland = { path = "../video-wayland" }
# The kernel's sandbox (Landlock) for the video window process.
landlock = "=0.4.7"
# Its system call filter (seccomp-BPF, pure Rust, no libseccomp) and the system call numbers.
seccompiler = "=0.5.0"
libc = "0.2"
zeroize.workspace = true

[lints]
workspace = true
