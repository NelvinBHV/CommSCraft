[package]
name = "commscraft-video-wayland"
description = "A video window that hands GPU pictures (DMA-BUF) directly to the Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The Rust implementation of the Wayland protocol: no C library is linked.
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
# memfd for the title bar's pixels, written with ordinary writes (no shared mapping, no unsafe).
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
commscraft-video-ffmpeg = { path = "../video-ffmpeg" }

[lints]
workspace = true
