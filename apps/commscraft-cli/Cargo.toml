[package]
name = "commscraft-cli"
description = "Command-line tool for the owner's interop runs: sign in, provisioning summary, sign out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
