landlock = "=0.4.7"
# Its system call filter (seccomp-BPF, pure Rust, no libseccomp) and the system call numbers.
seccompiler = "=0.5.0"
libc = "0.2"
commscraft-turn-bwm = { path = "../../crates/turn-bwm" }
commscraft-sdp = { path = "../../crates/sdp" }
commscraft-rdp-view = { path = "../../crates/rdp-view" }
