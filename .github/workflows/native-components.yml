# Issue #256: the native components bundled from source (MIT Kerberos) checked against their
# newest upstream release, weekly and when the packaging changes. Read-only, free runner.
name: native-components
on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths: ["packaging/**", "scripts/check_native_components.py", ".github/workflows/native-components.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Bundled native sources against upstream releases
        run: python3 -I scripts/check_native_components.py
