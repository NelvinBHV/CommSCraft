# Renders the approved sounds and offers them as an artifact (issue #92): read-only, it never
# writes to the repository. New renderings reach main through a normal pull request.
name: Build approved CommSCraft sounds

on:
  pull_request:
    paths:
      - "assets/audio/generate_soundpack.py"
      - ".github/workflows/build-soundpack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fluid-soundfont-gm libfluidsynth3 python3-numpy python3-scipy python3-soundfile ffmpeg
      - name: Render Pulse V5, Beat Call V5, Signal Message V4
        run: /usr/bin/python3 assets/audio/generate_soundpack.py
      - name: Compare with the files in the repository
        run: |
          if git diff --quiet -- assets/audio; then
            echo "::notice::The rendering is identical to the files in the repository"
          else
            git diff --stat -- assets/audio
            echo "::notice::The rendering differs from the repository; the artifact can be reviewed and added through a pull request"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: commscraft-soundpack
          retention-days: 7
          path: |
            assets/audio/*.wav
            assets/audio/*.opus
            assets/audio/*.mp3
            assets/audio/SHA256SUMS.txt
