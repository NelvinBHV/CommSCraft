name: RFC 3261 reliable SIP router evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  router-offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Source and specification integrity
        run: python scripts/check_v013_evidence.py
      - name: Run offline routing unit and framed-wire tests
        run: cargo test -p commscraft-router --all-targets
      - name: Run offline router demo
        run: cargo run -p commscraft-inspect -- --router-demo
      - name: Full Windows-client parity release gate must remain blocked
        shell: bash
        run: |
          if python scripts/check_release.py --release; then
            echo "Invalid release: incomplete Windows Full-client features"
            exit 1
          fi
