name: Experimental snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate source and evidence
        run: |
          python3 -m unittest discover -s scripts -p 'test*.py'
          python3 scripts/check_release.py
      - name: Package source only (not a compiled release)
        run: |
          tar --exclude=.git -czf commscraft-experimental-source.tar.gz .
          sha256sum commscraft-experimental-source.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: commscraft-experimental-source
          path: |
            commscraft-experimental-source.tar.gz
            SHA256SUMS.txt
