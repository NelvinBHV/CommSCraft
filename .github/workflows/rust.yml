name: Rust workspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate feature parity coverage schema
        run: |
          python3 scripts/check_release.py
          python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Block incomplete v1.0 release tags
        if: startsWith(github.ref, 'refs/tags/v1.')
        run: python3 scripts/check_release.py --release
      - name: Desktop system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libssl-dev pkg-config
      - name: Format workspace before checking (rustfmt unavailable in authoring environment)
        run: cargo fmt --all
      - name: Unit and offline fixture tests
        run: cargo test --workspace --all-targets
      - name: RFC 3261 framed TLS receive tests
        run: |
          cargo test -p sfb-core inbound
          cargo test -p sfb-transport
          python3 scripts/check_v012_evidence.py
      - name: RFC 3261 + MS-SIPAE REGISTER integration regression
        run: cargo test -p sfb-core --test verified_registration
      - name: Offline inspector smoke test
        run: |
          cargo run --quiet -p sfb-inspect -- --demo
          cargo run --quiet -p sfb-inspect -- --register-demo
          cargo run --quiet -p sfb-inspect -- --sa-demo
          cargo run --quiet -p sfb-inspect -- --signing-demo
          cargo run --quiet -p sfb-inspect -- --kerberos-plan-demo
          cargo run --quiet -p sfb-inspect -- --sspi-check
          cargo run --quiet -p sfb-inspect -- --protocol-demo
          cargo run --quiet -p sfb-inspect -- tests/fixtures/sip/register.sip
          cargo run --quiet -p sfb-inspect -- tests/fixtures/sip/challenge.sip
          cargo run --quiet -p sfb-probe -- --domain example.com
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Enforce Windows Full client parity manifest completeness
        shell: pwsh
        run: |
          python scripts/check_release.py
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Windows compile and offline tests
        shell: pwsh
        run: |
          cargo test --workspace --all-targets
          cargo test -p sfb-core kerberos_mic
          cargo test -p sfb-core --test verified_registration
          cargo check -p sfb-desktop
          cargo run -p sfb-inspect -- --sspi-check
      - name: Block unjustified 1.0 tag on Windows
        if: startsWith(github.ref, 'refs/tags/v1.')
        shell: pwsh
        run: python scripts/check_release.py --release
