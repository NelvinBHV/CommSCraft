# Preview bundles only: public repo, standard free runner, read-only token.
# No GitHub Release, no remote deployment, no secrets, no writes to this repo.
name: Flatpak preview

on:
  pull_request:
    paths:
      - ".github/workflows/flatpak.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/**"
      - "crates/**"
      - "assets/branding/**"
      - "packaging/flatpak/**"
      - "scripts/generate_flatpak_cargo_sources.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The official Flatpak build container needs --privileged; do not run
    # untrusted code from fork PRs in that container.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate offline Cargo sources with checksums from Cargo.lock
        run: python3 -I scripts/generate_flatpak_cargo_sources.py Cargo.lock packaging/flatpak/cargo-sources.json
      - name: Build standalone x86_64 Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: CommSCraft.flatpak
          manifest-path: packaging/flatpak/io.github.NelvinBHV.CommSCraft.yml
          cache-key: commscraft-flatpak-${{ hashFiles('Cargo.lock', 'packaging/flatpak/io.github.NelvinBHV.CommSCraft.yml') }}
