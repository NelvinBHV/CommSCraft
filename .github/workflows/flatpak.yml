# Builds the Flatpak bundle of the desktop client for a release. Read-only: the bundle is kept
# as a workflow artifact and attached to the GitHub release by the maintainer (issue #92: no
# workflow can change the repository). Free GitHub-hosted runner only.
name: flatpak
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/flatpak.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: CommSCraft.flatpak
          manifest-path: packaging/flatpak/io.github.nelvinbhv.CommSCraft.yml
          cache: false
          upload-artifact: true
