# Builds the Flatpak bundle of the desktop client for a release. Read-only: the bundle is kept
# as a workflow artifact and attached to the GitHub release by the maintainer (issue #92: no
# workflow can change the repository). Free GitHub-hosted runner only.
name: flatpak
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", ".github/workflows/flatpak.yml", "Cargo.lock", "scripts/generate_flatpak_cargo_sources.py"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    # The build container runs privileged: no code from fork pull requests in it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Offline Cargo sources with checksums from Cargo.lock
        run: python3 -I scripts/generate_flatpak_cargo_sources.py Cargo.lock packaging/flatpak/cargo-sources.json
      # The image's runtimes cannot be updated in place inside the container ("Invalid
      # cross-device link" since a new SDK 25.08 build, 2026-11-21): remove them, so the builder
      # installs the current ones fresh.
      - name: Fresh runtimes
        run: flatpak uninstall --all --noninteractive -y || true
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: CommSCraft.flatpak
          manifest-path: packaging/flatpak/io.github.NelvinBHV.CommSCraft.yml
          cache: false
          upload-artifact: true
