name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: Rust + RFC/MS evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux UI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libssl-dev pkg-config
      - name: Verify source contracts and immutable RFC/MS evidence
        run: |
          python3 scripts/check_release.py
          python3 -m unittest discover -s scripts -p "test*.py"
          python3 scripts/check_import_integrity.py
      - name: Validate v0.30 milestone evidence structure (pending gates allowed)
        run: python3 scripts/check_v030_milestone.py
      - name: Run imported Rust offline tests
        run: cargo test --workspace --all-targets
      - name: Historical import rustfmt check (tracked debt, not green)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Strict Rust warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Guard 1.0 release tags
        if: startsWith(github.ref, 'refs/tags/v1.')
        run: cargo run -p commscraft-xtask -- release-check
