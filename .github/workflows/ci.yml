# CI on standard GitHub-hosted runners only (no runners or services that cause costs).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: ALSA headers for the audio device adapter
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libasound2-dev
      - name: FFmpeg libraries and headers for the video adapter
        run: sudo apt-get install -y -q --no-install-recommends pkg-config clang libclang-dev libavcodec-dev libavformat-dev libavdevice-dev libavutil-dev libswscale-dev
      - name: Kerberos (GSSAPI) headers for the Kerberos adapter
        run: sudo apt-get install -y -q --no-install-recommends libkrb5-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (specification test vectors)
        run: cargo test --locked

  # Issue #147: known advisories (RustSec) for every crate in Cargo.lock, warnings such as
  # unmaintained or unsound crates included. The native FFmpeg, ALSA and Kerberos libraries come
  # from the build host's packages and are not covered here (see docs/security.md).
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: cargo-audit (pinned)
        run: cargo install --locked cargo-audit --version 0.23.0
      - name: RustSec advisories of Cargo.lock
        run: cargo audit --deny warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generated open-point list is up to date
        run: |
          python3 -I scripts/collect_open_points.py
          git diff --exit-code docs/protocol/conflicts-gaps-open-points.md
      - name: Decisions stay local (only in the gitignored plan/)
        run: |
          if git grep -nIE '(^|[^A-Za-z0-9-])[DT]-[0-9]{2}\b' || git ls-files | grep -E '(^|/)decisions\.md$'; then
            echo "decision references do not belong into the repository"; exit 1
          fi
      - name: Sound files match their checksums
        run: cd assets/audio && sha256sum -c --quiet SHA256SUMS.txt
      - name: Workflows cannot change the repository
        run: python3 -I scripts/check_workflows.py
      - name: No specification documents or captures committed
        run: |
          if git ls-files | grep -i -E '\.(pdf|pcap|pcapng|etl|docx?)$'; then
            echo "forbidden file type committed"; exit 1
          fi
